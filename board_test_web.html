<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Board Test</title>
<style>
:root {
  --bg: #0f1115; --surface: #171a21; --surface2: #1f232c; --row-alt: #1a1e26; --border: #2a2f3a;
  --text: #e6e8eb; --muted: #8b93a1; --accent: #ff8a00; --ok: #22c55e; --warn: #f59e0b; --err: #ef4444; --off: #4b5563;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--text); font: 13px/1.4 "Inter", "Segoe UI", "Roboto", system-ui, sans-serif; display: flex; flex-direction: column; }
button, select, input { font: inherit; color: inherit; }
button { background: var(--surface2); border: 1px solid var(--border); border-radius: 6px; padding: 6px 14px; cursor: pointer; }
button:hover:not(:disabled) { border-color: var(--accent); }
button:disabled { color: var(--off); cursor: default; }
button.primary { background: var(--accent); color: #111; border: none; font-weight: 700; padding: 7px 18px; min-width: 120px; }
button.primary:hover { background: #ffa033; }
button.primary.connected { background: var(--err); color: #fff; }
select, input[type=text] { background: var(--surface2); border: 1px solid var(--border); border-radius: 6px; padding: 5px 8px; }
input[type=text]:focus { outline: none; border-color: var(--accent); }
select:disabled, input:disabled { color: var(--muted); }
input[type=checkbox] { accent-color: var(--accent); }

header { background: var(--surface); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px; padding: 10px 18px; flex-wrap: wrap; }
.dot { color: var(--accent); font-size: 20px; line-height: 1; }
.app-title { font-size: 16px; font-weight: 700; margin-right: 16px; }
.nav { background: transparent; border: 1px solid transparent; color: var(--muted); font-weight: 600; }
.nav:hover { color: var(--text); }
.nav.active { background: #2a1d0c; color: var(--accent); border-color: #5a3a10; }
.spacer { flex: 1; }
.pill { min-width: 150px; text-align: center; border: 1px solid; border-radius: 13px; padding: 4px 12px; font-weight: 700; background: var(--surface2); }

main { flex: 1; overflow: auto; }
.page { padding: 20px 24px; display: flex; flex-direction: column; gap: 16px; }
.page[hidden] { display: none; }
.row3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.row2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
@media (max-width: 1000px) { .row3, .row2 { grid-template-columns: minmax(0, 1fr); } }

.card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.card-head { display: flex; align-items: center; gap: 8px; min-height: 30px; }
.card-title { color: var(--muted); font-size: 11px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; }
.badge { color: var(--accent); border: 1px solid #5a3a10; border-radius: 4px; padding: 1px 6px; font-size: 11px; font-weight: 700; }
.muted { color: var(--muted); }
.strong { font-weight: 600; }
.card-foot { display: flex; align-items: center; gap: 8px; }
.card-foot .status { flex: 1; color: var(--muted); }

.kv { display: grid; grid-template-columns: auto 1fr; gap: 7px 16px; }
.kv .k { color: var(--muted); }
.kv .v { font-weight: 600; text-align: right; overflow-wrap: anywhere; }

.channels { display: grid; grid-template-columns: auto 1fr 48px; gap: 6px 12px; align-items: center; }
.channels .name { color: var(--muted); }
.channels .val { font-weight: 600; text-align: right; }
.bar { height: 10px; background: var(--surface2); border: 1px solid var(--border); border-radius: 4px; overflow: hidden; }
.bar > div { height: 100%; background: var(--accent); border-radius: 3px; width: 0; }

.table-wrap { overflow-x: auto; }
.table-wrap.log { max-height: 320px; overflow-y: auto; }
table { width: 100%; border-collapse: collapse; }
th { text-align: left; color: var(--muted); font-weight: 700; padding: 8px; border-bottom: 1px solid var(--border); position: sticky; top: 0; background: var(--surface); white-space: nowrap; }
td { padding: 0 8px; height: 34px; white-space: pre; overflow: hidden; text-overflow: ellipsis; max-width: 520px; }
td.wrap { white-space: pre-wrap; }
tbody tr:nth-child(even) { background: var(--row-alt); }
td.child { padding-left: 28px; color: var(--muted); }
td.bold { font-weight: 700; }
td input[type=text] { width: 90px; padding: 3px 6px; }

.form { display: grid; grid-template-columns: auto 1fr; gap: 8px 16px; align-items: center; }
.form label.check { grid-column: 1 / -1; display: flex; gap: 8px; align-items: center; }
.toolbar { display: flex; align-items: center; gap: 8px; }
.toolbar .info { flex: 1; color: var(--muted); }

footer { background: var(--surface); color: var(--muted); border-top: 1px solid var(--border); padding: 4px 12px; min-height: 26px; }
.banner { background: #2b1416; border: 1px solid #6b2429; color: #fca5a5; border-radius: 8px; padding: 10px 14px; }
</style>
</head>
<body>
<header>
  <span class="dot">&#9679;</span>
  <span class="app-title">Board Test</span>
  <button class="nav active" data-page="monitor">Monitor</button>
  <button class="nav" data-page="setup">Setup</button>
  <span class="spacer"></span>
  <select id="baud" title="Baud rate (ignored by USB ports)"></select>
  <button id="connect" class="primary">Connect</button>
  <span id="pill" class="pill"></span>
</header>

<main>
  <section id="page-monitor" class="page">
    <div id="unsupported" class="banner" hidden>
      This browser has no Web Serial support. Open this file in Chrome or Edge on a desktop computer.
    </div>
    <div class="row3">
      <div class="card">
        <div class="card-head"><span class="card-title">Board</span></div>
        <div id="board" class="kv"></div>
      </div>
      <div class="card">
        <div class="card-head"><span class="card-title">RC Channels</span><span class="spacer"></span><span id="rc-info" class="muted"></span></div>
        <div id="rc" class="channels"></div>
      </div>
      <div class="card">
        <div class="card-head"><span class="card-title">Motor Outputs</span></div>
        <div id="servo" class="channels"></div>
      </div>
    </div>

    <div class="card">
      <div class="card-head">
        <span class="card-title">Live Data</span><span class="spacer"></span>
        <span class="param-info muted"></span>
        <button id="reload-ids">Reload IDs</button>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Item</th><th>Chip</th><th>Bus</th><th>Address / Port</th><th style="width:100%">Value</th></tr></thead>
          <tbody id="live"></tbody>
        </table>
      </div>
    </div>

    <div class="card">
      <div class="card-head">
        <span class="card-title">Messages</span><span class="spacer"></span>
        <select id="severity">
          <option value="7">All messages</option>
          <option value="4">Warnings and errors</option>
          <option value="3">Errors only</option>
        </select>
        <button id="clear-log">Clear</button>
      </div>
      <div id="log-wrap" class="table-wrap log">
        <table>
          <thead><tr><th>Time</th><th>Severity</th><th style="width:100%">Message</th></tr></thead>
          <tbody id="log"></tbody>
        </table>
      </div>
    </div>
  </section>

  <section id="page-setup" class="page" hidden>
    <div class="toolbar">
      <span class="param-info info"></span>
      <button id="read-params">Read Parameters</button>
      <button id="reboot">Reboot Board</button>
    </div>
    <div class="card">
      <div class="card-head"><span class="card-title">Onboard Hardware</span></div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Item</th><th>Interface</th><th>Status</th><th style="width:100%">Details</th></tr></thead>
          <tbody id="onboard"></tbody>
        </table>
      </div>
    </div>
    <div id="peripherals" class="row2"></div>
  </section>
</main>

<footer id="statusbar">Select a port and connect</footer>

<template id="network-template">
  <div class="card">
    <div class="card-head"><span class="card-title">Network</span><span class="badge">Ethernet</span></div>
    <div class="form">
      <label class="check"><input type="checkbox" id="net-enable"> Enable networking</label>
      <label class="check"><input type="checkbox" id="net-dhcp"> Use DHCP</label>
      <span class="muted">IP address</span><input type="text" id="net-ip" placeholder="192.168.144.14">
      <span class="muted">Netmask</span><input type="text" id="net-mask" placeholder="255.255.255.0">
      <span class="muted">Gateway</span><input type="text" id="net-gw" placeholder="192.168.144.1">
      <span class="muted">MAC address</span><span id="net-mac" class="strong">-</span>
    </div>
    <div class="card-foot">
      <span id="net-status" class="status"></span>
      <button id="net-reload">Reload</button>
      <button id="net-apply">Apply</button>
    </div>
  </div>
</template>

// ---- MAVLink codec ---------------------------------------------------------------------------

const TYPE_SIZE = { int8_t: 1, uint8_t: 1, char: 1, int16_t: 2, uint16_t: 2, int32_t: 4, uint32_t: 4, float: 4,
  int64_t: 8, uint64_t: 8, double: 8, uint8_t_mavlink_version: 1 };
const MSG_BY_ID = new Map(), MSG_BY_NAME = new Map();
for (const [id, name, crc, spec] of DEFS.messages) {
  const fields = spec.split(',').map(f => { const [n, t, len] = f.split(':'); return [n, t, len ? +len : 0]; });
  const def = { id, name, crc, fields, len: fields.reduce((s, [, t, n]) => s + TYPE_SIZE[t] * (n || 1), 0) };
  MSG_BY_ID.set(id, def);
  MSG_BY_NAME.set(name, def);
}

function crcAccumulate(byte, crc) {
  let tmp = (byte ^ (crc & 0xff)) & 0xff;
  tmp = (tmp ^ (tmp << 4)) & 0xff;
  return ((crc >> 8) ^ (tmp << 8) ^ (tmp << 3) ^ (tmp >> 4)) & 0xffff;
}

function crcX25(bytes, start, end, extra) {
  let crc = 0xffff;
  for (let i = start; i < end; i++) crc = crcAccumulate(bytes[i], crc);
  return crcAccumulate(extra, crc);
}

function readNum(dv, off, type) {
  switch (type) {
    case 'int8_t': return dv.getInt8(off);
    case 'int16_t': return dv.getInt16(off, true);
    case 'uint16_t': return dv.getUint16(off, true);
    case 'int32_t': return dv.getInt32(off, true);
    case 'uint32_t': return dv.getUint32(off, true);
    case 'float': return dv.getFloat32(off, true);
    case 'double': return dv.getFloat64(off, true);
    case 'int64_t': return dv.getBigInt64(off, true);
    case 'uint64_t': return dv.getBigUint64(off, true);
    default: return dv.getUint8(off);
  }
}

function writeNum(dv, off, type, v) {
  switch (type) {
    case 'int8_t': return dv.setInt8(off, v);
    case 'int16_t': return dv.setInt16(off, v, true);
    case 'uint16_t': return dv.setUint16(off, v, true);
    case 'int32_t': return dv.setInt32(off, v, true);
    case 'uint32_t': return dv.setUint32(off, v, true);
    case 'float': return dv.setFloat32(off, v, true);
    case 'double': return dv.setFloat64(off, v, true);
    case 'int64_t': return dv.setBigInt64(off, BigInt(v), true);
    case 'uint64_t': return dv.setBigUint64(off, BigInt(v), true);
    default: return dv.setUint8(off, v);
  }
}

const textDecoder = new TextDecoder(), textEncoder = new TextEncoder();

function decodePayload(def, payload) {
  const buf = new Uint8Array(def.len);  // MAVLink 2 trims trailing zeros, pad them back
  buf.set(payload.subarray(0, def.len));
  const dv = new DataView(buf.buffer);
  const msg = { _name: def.name, _id: def.id };
  let off = 0;
  for (const [name, type, n] of def.fields) {
    const size = TYPE_SIZE[type], count = n || 1;
    if (type === 'char') {
      const bytes = buf.subarray(off, off + count);
      const end = bytes.indexOf(0);
      msg[name] = textDecoder.decode(end < 0 ? bytes : bytes.subarray(0, end));
    } else if (n) {
      msg[name] = range(n).map(i => readNum(dv, off + i * size, type));
    } else {
      msg[name] = readNum(dv, off, type);
    }
    off += size * count;
  }
  return msg;
}

let txSeq = 0;
function encodeMessage(name, values) {
  const def = MSG_BY_NAME.get(name);
  const buf = new Uint8Array(def.len);
  const dv = new DataView(buf.buffer);
  let off = 0;
  for (const [fname, type, n] of def.fields) {
    const size = TYPE_SIZE[type], count = n || 1, v = values[fname];
    if (type === 'char') {
      buf.set(textEncoder.encode(v || '').subarray(0, count), off);
    } else {
      for (let i = 0; i < count; i++) writeNum(dv, off + i * size, type, (Array.isArray(v) ? v[i] : i === 0 ? v : 0) || 0);
    }
    off += size * count;
  }
  let plen = def.len;
  while (plen > 1 && buf[plen - 1] === 0) plen--;
  const frame = new Uint8Array(10 + plen + 2);
  frame.set([0xfd, plen, 0, 0, txSeq++ & 0xff, GCS_SYSID, GCS_COMPID, def.id & 0xff, (def.id >> 8) & 0xff, (def.id >> 16) & 0xff]);
  frame.set(buf.subarray(0, plen), 10);
  const crc = crcX25(frame, 1, 10 + plen, def.crc);
  frame[10 + plen] = crc & 0xff;
  frame[11 + plen] = crc >> 8;
  return frame;
}

class MavParser {
  constructor() { this.buf = new Uint8Array(0); }

  push(chunk) {
    const b = new Uint8Array(this.buf.length + chunk.length);
    b.set(this.buf);
    b.set(chunk, this.buf.length);
    const out = [];
    let i = 0;
    while (i < b.length) {
      const magic = b[i];
      if (magic !== 0xfd && magic !== 0xfe) { i++; continue; }
      if (i + 3 > b.length) break;
      const v2 = magic === 0xfd, plen = b[i + 1], hdr = v2 ? 10 : 6;
      const total = hdr + plen + 2 + (v2 && (b[i + 2] & 1) ? 13 : 0);
      if (i + total > b.length) break;
      const msgid = v2 ? b[i + 7] | (b[i + 8] << 8) | (b[i + 9] << 16) : b[i + 5];
      const def = MSG_BY_ID.get(msgid);
      const crc = b[i + hdr + plen] | (b[i + hdr + plen + 1] << 8);
      if (!def || crcX25(b, i + 1, i + hdr + plen, def.crc) !== crc) { i++; continue; }  // resync
      const msg = decodePayload(def, b.subarray(i + hdr, i + hdr + plen));
      msg._sys = b[i + (v2 ? 5 : 3)];
      msg._comp = b[i + (v2 ? 6 : 4)];
      out.push(msg);
      i += total;
    }
    this.buf = b.slice(i);
    return out;
  }
}

// ---- helpers ---------------------------------------------------------------------------------

const $ = id => document.getElementById(id);
const now = () => performance.now() / 1000;
const deg = r => r * 180 / Math.PI;

function el(tag, attrs = {}, ...children) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'class') node.className = v; else if (k === 'text') node.textContent = v; else node.setAttribute(k, v);
  }
  node.append(...children);
  return node;
}

function setText(node, text, color = '') {
  text = String(text);
  if (node.textContent !== text) node.textContent = text;
  if (node.style.color !== color) node.style.color = color;
}

// rows: arrays of cells { t: text, c: color, b: bold, cls: class }; reuses existing DOM nodes
function syncRows(tbody, rows) {
  while (tbody.rows.length > rows.length) tbody.deleteRow(-1);
  rows.forEach((cells, i) => {
    const tr = tbody.rows[i] || tbody.insertRow();
    while (tr.cells.length < cells.length) tr.insertCell();
    cells.forEach((cell, j) => {
      const td = tr.cells[j];
      const text = cell.t ?? '';
      if (td.textContent !== text) { td.textContent = text; td.title = text; }
      const cls = [cell.cls, cell.b ? 'bold' : ''].filter(Boolean).join(' ');
      if (td.className !== cls) td.className = cls;
      if (td.style.color !== (cell.c || '')) td.style.color = cell.c || '';
    });
  });
}

function xyz(x, y, z, unit, digits = 0) {
  return `X ${x.toFixed(digits)}   Y ${y.toFixed(digits)}   Z ${z.toFixed(digits)}  ${unit}`;
}

function formatUptime(ms) {
  const s = Math.floor(ms / 1000), p = n => String(n).padStart(2, '0');
  return `${p(Math.floor(s / 3600))}:${p(Math.floor(s % 3600 / 60))}:${p(s % 60)}`;
}

const hex = (v, w) => '0x' + v.toString(16).toUpperCase().padStart(w, '0');
const formatParam = (v, isInt) => isInt ? String(v) : String(parseFloat(v.toPrecision(7)));
const enumName = (e, v) => DEFS.enums[e][v] ?? String(v);

function decodeDeviceId(devId, kind, ardupilot) {
  const busType = devId & 0x07, busNum = (devId >> 3) & 0x1f, address = (devId >> 8) & 0xff, devtype = (devId >> 16) & 0xff;
  const bus = BUS_TYPES[busType] ?? `Bus ${busType}`;
  const addr = [1, 2, 7].includes(busType) ? hex(address, 2) : busType === 3 ? `Node ${address}` : String(address);
  const chip = ardupilot ? (CHIP_TABLES[kind] || {})[devtype] : undefined;
  return { bus: `${bus} ${busNum}`, address: addr, chip: chip ? `${chip} (${hex(devtype, 2)})` : `Type ${hex(devtype, 2)}`, name: chip };
}

const f32 = new DataView(new ArrayBuffer(4));
function floatBitsToInt(v) { f32.setFloat32(0, v, true); return f32.getInt32(0, true); }
function intBitsToFloat(v) { f32.setInt32(0, v, true); return f32.getFloat32(0, true); }

let notifyTimer = null;
function notify(text, ms = 8000) {
  $('statusbar').textContent = text;
  clearTimeout(notifyTimer);
  if (ms) notifyTimer = setTimeout(() => { $('statusbar').textContent = ''; }, ms);
}

// ---- state -----------------------------------------------------------------------------------

let S;
function resetState() {
  S = {
    target: null, autopilot: null, lastHeartbeat: 0, hb: null, version: {},
    params: new Map(), paramTypes: new Map(), paramNames: [], paramTries: 0,
    live: new Map(), magField: new Map(), values: new Map(), attitude: null, power: null, gps: new Map(),
    sysStatus: null, powerStatus: null, mcu: null, hwstatus: null, iomcu: null, rc: null, servo: null,
    log: [], logSeq: 0, logShown: null, netLoaded: false,
  };
}
resetState();

const conn = { port: null, reader: null, writer: null, readLoop: null, parser: null, closing: false, txChain: Promise.resolve() };
const timers = { refresh: null, heartbeat: null, params: null };

const isArduPilot = () => S.autopilot === K.MAV_AUTOPILOT_ARDUPILOTMEGA;
const isPX4 = () => S.autopilot === K.MAV_AUTOPILOT_PX4;
const liveKey = (kind, inst) => `${kind}:${inst}`;

// ---- serial connection -----------------------------------------------------------------------

async function connect() {
  let port;
  try {
    port = await navigator.serial.requestPort();
  } catch {
    return;  // user closed the port chooser
  }
  try {
    await port.open({ baudRate: +$('baud').value, bufferSize: 65536 });
  } catch (e) {
    notify(`Could not open port: ${e.message}`);
    return;
  }
  resetState();
  clearViews();
  Object.assign(conn, { port, parser: new MavParser(), closing: false, writer: port.writable.getWriter(), txChain: Promise.resolve() });
  conn.readLoop = readLoop();
  setConnectedUi(true);
  notify('Port opened, waiting for heartbeat...');
}

async function readLoop() {
  while (conn.port && conn.port.readable && !conn.closing) {
    conn.reader = conn.port.readable.getReader();
    try {
      for (;;) {
        const { value, done } = await conn.reader.read();
        if (done) break;
        for (const msg of conn.parser.push(value)) {
          try { handleMessage(msg); } catch (e) { console.error(e); notify(`Internal error: ${e.message}`, 0); }
        }
      }
    } catch (e) {
      if (!conn.closing) {
        notify(`Connection error: ${e.message}`, 0);
        conn.reader.releaseLock();
        conn.reader = null;
        disconnect();
        return;
      }
    } finally {
      if (conn.reader) { conn.reader.releaseLock(); conn.reader = null; }
    }
  }
}

async function disconnect() {
  if (!conn.port || conn.closing) return;
  conn.closing = true;
  stopTimers();
  const port = conn.port;
  try { if (conn.reader) await conn.reader.cancel(); } catch { /* already closed */ }
  try { await conn.readLoop; } catch { /* ignore */ }
  try { await conn.txChain; } catch { /* ignore */ }
  try { conn.writer.releaseLock(); } catch { /* ignore */ }
  try { await port.close(); } catch { /* ignore */ }
  Object.assign(conn, { port: null, reader: null, writer: null, readLoop: null, closing: false });
  setConnectedUi(false);
  notify('Disconnected');
}

function send(name, values) {
  if (!conn.writer || conn.closing) return;
  const frame = encodeMessage(name, values);
  conn.txChain = conn.txChain.then(() => conn.writer && conn.writer.write(frame)).catch(e => {
    notify(`Write error: ${e.message}`, 0);
  });
}

function sendCommand(command, ...params) {
  const p = [...params, 0, 0, 0, 0, 0, 0, 0];
  send('COMMAND_LONG', { target_system: S.target[0], target_component: S.target[1], command, confirmation: 0,
    param1: p[0], param2: p[1], param3: p[2], param4: p[3], param5: p[4], param6: p[5], param7: p[6] });
}

function sendHeartbeat() {
  send('HEARTBEAT', { type: K.MAV_TYPE_GCS, autopilot: K.MAV_AUTOPILOT_INVALID, base_mode: 0, custom_mode: 0,
    system_status: 0, mavlink_version: 3 });
}

function stopTimers() {
  for (const key of Object.keys(timers)) { clearInterval(timers[key]); timers[key] = null; }
}

function setConnectedUi(connected) {
  const btn = $('connect');
  btn.textContent = connected ? 'Disconnect' : 'Connect';
  btn.classList.toggle('connected', connected);
  $('baud').disabled = connected;
  for (const node of document.querySelectorAll('[data-needs-link]')) node.disabled = !connected;
  if (connected) {
    timers.refresh = setInterval(refresh, REFRESH_MS);
    timers.heartbeat = setInterval(sendHeartbeat, 1000);
  } else {
    stopTimers();
  }
  updatePill();
}

function updatePill() {
  let text, color;
  if (!conn.port) [text, color] = ['Disconnected', COLOR.err];
  else if (!S.target) [text, color] = ['Waiting heartbeat', COLOR.warn];
  else if (now() - S.lastHeartbeat > HEARTBEAT_TIMEOUT_S) [text, color] = ['Link lost', COLOR.err];
  else [text, color] = ['Connected', COLOR.ok];
  const pill = $('pill');
  setText(pill, `●  ${text}`, color);
  pill.style.borderColor = color;
}

// ---- parameters ------------------------------------------------------------------------------

function startParamFetch() {
  if (!conn.port || !S.target) return;
  let names = [];
  if (isPX4()) names = Object.values(PX4_DEVICE_PARAMS).flat();
  else if (isArduPilot()) names = [...Object.values(AP_DEVICE_PARAMS).flat(), ...AP_EXTRA_PARAMS, ...AP_SETUP_PARAMS];
  S.paramNames = [...new Set(names)];
  for (const n of S.paramNames) S.params.delete(n);
  S.netLoaded = false;
  fetchParams();
}

function fetchParams() {
  S.paramTries = 0;
  clearInterval(timers.params);
  timers.params = null;
  requestMissingParams();
  if (S.paramNames.length && !timers.params) timers.params = setInterval(requestMissingParams, PARAM_RETRY_MS);
}

function requestMissingParams() {
  const missing = S.paramNames.filter(n => !S.params.has(n));
  if (!missing.length || S.paramTries >= PARAM_MAX_TRIES) {
    clearInterval(timers.params);
    timers.params = null;
    return;
  }
  S.paramTries++;
  for (const name of missing) {
    send('PARAM_REQUEST_READ', { target_system: S.target[0], target_component: S.target[1], param_id: name, param_index: -1 });
  }
}

const paramFetching = () => timers.params !== null;
const paramInt = name => S.params.has(name) ? Math.trunc(S.params.get(name)) : 0;
const paramMissing = name => S.paramNames.includes(name) && !S.params.has(name) && !paramFetching();

function paramLookup(name) {
  if (S.params.has(name)) {
    const v = S.params.get(name);
    return [formatParam(v, INT_TYPES.has(S.paramTypes.get(name))), '', v];
  }
  if (!S.target) return ['-', COLOR.muted, null];
  if (paramMissing(name)) return ['n/a', COLOR.muted, null];
  return ['…', COLOR.muted, null];
}

function writeParams(pairs) {
  if (!S.target) return ['Not connected', COLOR.err];
  const changes = [];
  for (const [name, text] of pairs) {
    if (!text || paramMissing(name)) continue;
    const value = Number(text);
    if (!Number.isFinite(value)) return [`Invalid value for ${name}: ${text}`, COLOR.err];
    const current = S.params.get(name);
    if (current !== undefined && Math.fround(current) === Math.fround(value)) continue;
    changes.push([name, value]);
  }
  if (!changes.length) return ['Nothing to change', COLOR.muted];
  for (const [name, value] of changes) {
    const type = S.paramTypes.get(name) ?? K.MAV_PARAM_TYPE_REAL32;
    const raw = isPX4() && INT_TYPES.has(type) ? intBitsToFloat(Math.trunc(value)) : value;
    send('PARAM_SET', { target_system: S.target[0], target_component: S.target[1], param_id: name, param_value: raw, param_type: type });
    S.params.delete(name);
    if (!S.paramNames.includes(name)) S.paramNames.push(name);
  }
  fetchParams();
  return [`Wrote ${changes.length} parameter(s), reboot to apply`, COLOR.ok];
}

// ---- board info helpers ----------------------------------------------------------------------

function deviceId(kind, inst) {
  const names = (isPX4() ? PX4_DEVICE_PARAMS : AP_DEVICE_PARAMS)[kind] || [];
  return inst < names.length ? paramInt(names[inst]) : 0;
}

function devices(kind) {
  return range(3).map(i => deviceId(kind, i)).filter(Boolean).map(d => decodeDeviceId(d, kind, isArduPilot()));
}

function fresh(kind) {
  const t = now();
  for (const [key, entry] of S.live) if (key.startsWith(kind + ':') && t - entry.t <= STALE_S) return true;
  return false;
}

function gpsPorts() {
  const ports = [];
  for (let i = 1; i <= 8; i++) {
    if (paramInt(`SERIAL${i}_PROTOCOL`) === SERIAL_PROTOCOL_GPS) {
      const code = paramInt(`SERIAL${i}_BAUD`), baud = SERIAL_BAUDS[code] ?? code;
      ports.push(baud ? `SERIAL${i} @ ${baud}` : `SERIAL${i}`);
    }
  }
  return ports;
}

function gpsType(inst) {
  for (const name of inst === 0 ? ['GPS1_TYPE', 'GPS_TYPE'] : ['GPS2_TYPE', 'GPS_TYPE2']) {
    if (S.params.has(name)) return Math.trunc(S.params.get(name));
  }
  return null;
}

function sysStatusState(bit) {
  if (!S.sysStatus) return null;
  const [present, enabled, healthy] = S.sysStatus;
  return [!!(present & bit), !!(enabled & bit), !!(healthy & bit)];
}

// ---- incoming messages -----------------------------------------------------------------------

function setLive(kind, inst, msg, text) { S.live.set(liveKey(kind, inst), { msg, text, t: now() }); }
function setValue(key, label, text) { S.values.set(key, { label, text, t: now() }); }

function setMag(inst, msg, x, y, z, unit, toMgauss = null, digits = 0) {
  setLive('mag', inst, msg, xyz(x, y, z, unit, digits));
  if (toMgauss !== null) S.magField.set(inst, Math.hypot(x, y, z) * toMgauss);
}

function imu(inst, msg, m, unitAcc, unitGyro, unitMag) {
  setLive('accel', inst, msg, xyz(m.xacc, m.yacc, m.zacc, unitAcc));
  setLive('gyro', inst, msg, xyz(m.xgyro, m.ygyro, m.zgyro, unitGyro));
  if (m.xmag || m.ymag || m.zmag) setMag(inst, msg, m.xmag, m.ymag, m.zmag, unitMag, unitMag === 'mGauss' ? 1 : null);
  if (m.temperature) setLive('temp', inst, msg, `${(m.temperature / 100).toFixed(1)} C`);
}

function pressure(inst, msg, m) {
  setLive('baro', inst, msg, `${m.press_abs.toFixed(2)} hPa   ${(m.temperature / 100).toFixed(1)} C`);
  if (m.press_diff) setLive('airspeed', inst, msg, `${m.press_diff.toFixed(3)} hPa`);
}

function gps(inst, msg, m) {
  const info = {
    fix: GPS_FIX[m.fix_type] ?? String(m.fix_type), fixType: m.fix_type,
    sats: m.satellites_visible !== 255 ? m.satellites_visible : null, hdop: m.eph !== 0xffff ? m.eph / 100 : null,
    lat: m.lat / 1e7, lon: m.lon / 1e7, alt: m.alt / 1000, t: now(),
  };
  S.gps.set(inst, info);
  setLive('gps', inst, msg, info.fix);
}

function modeString(m) {
  if (!(m.base_mode & K.MAV_MODE_FLAG_CUSTOM_MODE_ENABLED)) return `Mode(${hex(m.base_mode, 8)})`;
  const map = DEFS.modes[m.type];
  return map && map[m.custom_mode] !== undefined ? map[m.custom_mode] : `Mode(${m.custom_mode})`;
}

const HANDLERS = {
  HEARTBEAT(m) {
    if (m.autopilot === K.MAV_AUTOPILOT_INVALID) return;
    if (S.target && m._sys !== S.target[0]) return;
    const first = !S.target;
    S.target = [m._sys, m._comp];
    S.autopilot = m.autopilot;
    S.lastHeartbeat = now();
    S.hb = {
      autopilot: AUTOPILOT_NAMES[m.autopilot] ?? enumName('MAV_AUTOPILOT', m.autopilot),
      vehicle: enumName('MAV_TYPE', m.type), state: enumName('MAV_STATE', m.system_status),
      armed: !!(m.base_mode & K.MAV_MODE_FLAG_SAFETY_ARMED), mode: modeString(m),
    };
    if (first) {
      notify(`Board found: system ${S.target[0]}, ${S.hb.autopilot}`);
      send('REQUEST_DATA_STREAM', { target_system: S.target[0], target_component: S.target[1],
        req_stream_id: K.MAV_DATA_STREAM_ALL, req_message_rate: 4, start_stop: 1 });
      sendCommand(K.MAV_CMD_REQUEST_MESSAGE, K.MAVLINK_MSG_ID_AUTOPILOT_VERSION);
      if (isArduPilot()) sendCommand(K.MAV_CMD_DO_SEND_BANNER);
      startParamFetch();
    }
  },
  AUTOPILOT_VERSION(m) {
    const v = m.flight_sw_version;
    const types = { 0: 'dev', 64: 'alpha', 128: 'beta', 192: 'rc', 255: 'official' };
    S.version.fwNumber = `${(v >>> 24) & 0xff}.${(v >>> 16) & 0xff}.${(v >>> 8) & 0xff} ${types[v & 0xff] ?? ''}`.trim();
    S.version.boardId = m.board_version ? String(m.board_version >>> 16) : '-';
    const uid2 = m.uid2 || [];
    if (uid2.some(Boolean)) {
      let end = uid2.length;
      while (end && !uid2[end - 1]) end--;
      S.version.uid = uid2.slice(0, end).map(b => b.toString(16).toUpperCase().padStart(2, '0')).join('');
    } else if (m.uid) {
      S.version.uid = m.uid.toString(16).toUpperCase().padStart(16, '0');
    }
  },
  STATUSTEXT(m) {
    const text = m.text.trim();
    const board = text.match(/^(\S+)\s+([0-9A-F]{8})\s+([0-9A-F]{8})\s+([0-9A-F]{8})$/);
    if (board) {
      S.version.board = board[1];
      S.version.uid ??= board[2] + board[3] + board[4];
    } else if (/^(Ardu\w+|Blimp|AP_Periph)\s+V\d/.test(text)) {
      S.version.firmware = text;
    } else if (text.startsWith('Frame:')) {
      S.version.frame = text.slice(6).trim();
    }
    if (text.toUpperCase().includes('IOMCU')) S.iomcu = [m.severity, text];
    const severity = enumName('MAV_SEVERITY', m.severity);
    S.log.push([new Date().toTimeString().slice(0, 8), m.severity, severity, text]);
    if (S.log.length > STATUS_LOG_MAX) S.log.splice(0, S.log.length - STATUS_LOG_MAX);
    S.logSeq++;
    notify(`[${severity}] ${text}`);
  },
  PARAM_VALUE(m) {
    let value = m.param_value;
    if (INT_TYPES.has(m.param_type)) value = isPX4() ? floatBitsToInt(value) : Math.round(value);
    S.params.set(m.param_id, value);
    S.paramTypes.set(m.param_id, m.param_type);
  },
  SYS_STATUS(m) {
    S.sysStatus = [m.onboard_control_sensors_present, m.onboard_control_sensors_enabled, m.onboard_control_sensors_health];
    S.power = {
      voltage: m.voltage_battery !== 0xffff ? m.voltage_battery / 1000 : null,
      current: m.current_battery >= 0 ? m.current_battery / 100 : null,
      remaining: m.battery_remaining >= 0 ? m.battery_remaining : null,
      load: m.load / 10, drop: m.drop_rate_comm / 100, t: now(),
    };
  },
  POWER_STATUS(m) { S.powerStatus = { vcc: m.Vcc / 1000, vservo: m.Vservo / 1000, flags: m.flags, t: now() }; },
  MCU_STATUS(m) {
    S.mcu = { temp: m.MCU_temperature / 100, v: m.MCU_voltage / 1000, vmin: m.MCU_voltage_min / 1000,
      vmax: m.MCU_voltage_max / 1000, t: now() };
  },
  HWSTATUS(m) { S.hwstatus = { vcc: m.Vcc / 1000, t: now() }; },
  SYSTEM_TIME(m) { S.version.uptime = formatUptime(m.time_boot_ms); },
  RAW_IMU(m) {
    // ArduPilot fills RAW_IMU with scaled, calibrated values (same units as SCALED_IMU)
    if (isArduPilot()) imu(m.id || 0, 'RAW_IMU', m, 'mG', 'mrad/s', 'mGauss');
    else imu(m.id || 0, 'RAW_IMU', m, 'raw', 'raw', 'raw');
  },
  SCALED_IMU(m) { imu(0, 'SCALED_IMU', m, 'mG', 'mrad/s', 'mGauss'); },
  SCALED_IMU2(m) { imu(1, 'SCALED_IMU2', m, 'mG', 'mrad/s', 'mGauss'); },
  SCALED_IMU3(m) { imu(2, 'SCALED_IMU3', m, 'mG', 'mrad/s', 'mGauss'); },
  HIGHRES_IMU(m) {
    const inst = m.id || 0;
    setLive('accel', inst, 'HIGHRES_IMU', xyz(m.xacc, m.yacc, m.zacc, 'm/s2', 2));
    setLive('gyro', inst, 'HIGHRES_IMU', xyz(m.xgyro, m.ygyro, m.zgyro, 'rad/s', 3));
    setMag(inst, 'HIGHRES_IMU', m.xmag, m.ymag, m.zmag, 'Gauss', 1000, 3);
    setLive('baro', inst, 'HIGHRES_IMU', `${m.abs_pressure.toFixed(2)} hPa   ${m.temperature.toFixed(1)} C`);
  },
  SCALED_PRESSURE(m) { pressure(0, 'SCALED_PRESSURE', m); },
  SCALED_PRESSURE2(m) { pressure(1, 'SCALED_PRESSURE2', m); },
  SCALED_PRESSURE3(m) { pressure(2, 'SCALED_PRESSURE3', m); },
  GPS_RAW_INT(m) { gps(0, 'GPS_RAW_INT', m); },
  GPS2_RAW(m) { gps(1, 'GPS2_RAW', m); },
  ATTITUDE(m) { S.attitude = { roll: deg(m.roll), pitch: deg(m.pitch), yaw: (deg(m.yaw) + 360) % 360, t: now() }; },
  VFR_HUD(m) {
    setValue('hud', 'Speed / Altitude', `Airspeed ${m.airspeed.toFixed(1)} m/s   Groundspeed ${m.groundspeed.toFixed(1)} m/s   `
      + `Alt ${m.alt.toFixed(1)} m   Heading ${m.heading}`);
  },
  DISTANCE_SENSOR(m) {
    setLive('range', m.id, 'DISTANCE_SENSOR', `${m.current_distance} cm   (range ${m.min_distance}-${m.max_distance} cm)`);
  },
  RANGEFINDER(m) {
    const cur = S.live.get(liveKey('range', 0));
    if (!cur || cur.msg === 'RANGEFINDER') setLive('range', 0, 'RANGEFINDER', `${(m.distance * 100).toFixed(0)} cm   ${m.voltage.toFixed(2)} V`);
  },
  OPTICAL_FLOW(m) { setLive('flow', 0, 'OPTICAL_FLOW', `X ${m.flow_x}   Y ${m.flow_y}   Quality ${m.quality}`); },
  BATTERY_STATUS(m) {
    const cells = m.voltages.filter(v => v !== 0 && v !== 0xffff);
    const volt = cells.length ? `${(cells.reduce((a, b) => a + b, 0) / 1000).toFixed(2)} V` : '-';
    const curr = m.current_battery >= 0 ? `${(m.current_battery / 100).toFixed(2)} A` : '- A';
    setValue(`battery${m.id + 1}`, `Battery ${m.id + 1}`, `${volt}   ${curr}   ${m.battery_remaining} %`);
  },
  RC_CHANNELS(m) {
    S.rc = { chans: range(Math.min(m.chancount, 18)).map(i => m[`chan${i + 1}_raw`]), rssi: m.rssi, t: now() };
  },
  SERVO_OUTPUT_RAW(m) {
    if (m.port) return;
    const outs = range(16).map(i => m[`servo${i + 1}_raw`] || 0);
    while (outs.length > 8 && !outs[outs.length - 1]) outs.pop();
    S.servo = outs;
  },
  EKF_STATUS_REPORT(m) {
    setValue('ekf', 'EKF Variances', `Vel ${m.velocity_variance.toFixed(2)}   Pos ${m.pos_horiz_variance.toFixed(2)}   `
      + `Alt ${m.pos_vert_variance.toFixed(2)}   Mag ${m.compass_variance.toFixed(2)}`);
  },
};

function handleMessage(msg) {
  if (msg._name === 'HEARTBEAT' && msg.type === K.MAV_TYPE_GCS) return;
  if (S.target && msg._name !== 'HEARTBEAT' && msg._sys !== S.target[0]) return;
  const handler = HANDLERS[msg._name];
  if (handler) handler(msg);
}

// ---- monitor page ----------------------------------------------------------------------------

const BOARD_KEYS = ['Board', 'Firmware', 'Autopilot', 'Vehicle', 'Frame', 'Flight Mode', 'Armed',
  'System State', 'System / Component', 'Board ID', 'UID', 'Uptime'];
const boardValues = {};
for (const key of BOARD_KEYS) {
  const v = el('span', { class: 'v', text: '-' });
  $('board').append(el('span', { class: 'k', text: key }), v);
  boardValues[key] = v;
}

function syncChannels(container, values) {
  if (container.childElementCount !== values.length * 3 || (!values.length && !container.childElementCount)) {
    container.replaceChildren();
    if (!values.length) container.append(el('span', { class: 'muted', text: 'No data' }));
    values.forEach((_, i) => {
      const bar = el('div', { class: 'bar' }, el('div'));
      container.append(el('span', { class: 'name', text: `${container.id === 'rc' ? 'CH' : 'OUT'}${i + 1}` }), bar,
        el('span', { class: 'val', text: '-' }));
    });
  }
  values.forEach((v, i) => {
    const used = v > 0 && v < 0xffff;
    const clamped = Math.max(PWM_MIN, Math.min(PWM_MAX, v));
    container.children[i * 3 + 1].firstChild.style.width = used ? `${(clamped - PWM_MIN) / (PWM_MAX - PWM_MIN) * 100}%` : '0';
    setText(container.children[i * 3 + 2], used ? String(v) : '-');
  });
}

function refreshBoard() {
  const hb = S.hb, v = S.version;
  if (hb) {
    const set = (k, t, c) => setText(boardValues[k], t, c);
    set('Board', v.board ?? '-');
    set('Firmware', v.firmware ?? v.fwNumber ?? '-');
    set('Autopilot', hb.autopilot);
    set('Vehicle', hb.vehicle);
    set('Frame', v.frame ?? '-');
    set('Flight Mode', hb.mode);
    set('Armed', hb.armed ? 'ARMED' : 'Disarmed', hb.armed ? COLOR.err : COLOR.ok);
    set('System State', hb.state);
    set('System / Component', `${S.target[0]} / ${S.target[1]}`);
    set('Board ID', v.boardId ?? '-');
    set('UID', v.uid ?? '-');
    set('Uptime', v.uptime ?? '-');
  }
  if (S.rc) {
    syncChannels($('rc'), S.rc.chans);
    setText($('rc-info'), S.rc.rssi !== 255 ? `RSSI ${S.rc.rssi}` : '');
  }
  if (S.servo) syncChannels($('servo'), S.servo);
}

function liveRows() {
  const t0 = now(), ardupilot = isArduPilot();
  const empty = { bus: '-', address: '-', chip: '-' };
  const rows = [];
  const stale = t => t0 - t > STALE_S;
  const timed = (t, color = '') => stale(t) ? COLOR.err : color;
  const live = key => {
    const e = S.live.get(key);
    return e ? [e.text, stale(e.t) ? COLOR.err : ''] : ['No data', COLOR.err];
  };
  const group = (label, chip = '', bus = '', addr = '', value = '', color = '') =>
    rows.push([{ t: label, b: true }, { t: chip, b: true }, { t: bus }, { t: addr }, { t: value, c: color }]);
  const child = (label, value, color) =>
    rows.push([{ t: label, cls: 'child' }, {}, {}, {}, { t: value, c: color }]);
  const single = (label, chip, bus, addr, value, color) =>
    rows.push([{ t: label }, { t: chip }, { t: bus }, { t: addr }, { t: value, c: color }]);

  for (const inst of range(3)) {
    const devs = { accel: deviceId('accel', inst), gyro: deviceId('gyro', inst) };
    const parts = IMU_PARTS.filter(([kind]) => devs[kind] || S.live.has(liveKey(kind, inst)));
    if (!parts.length) continue;
    const infos = Object.entries(devs).filter(([, d]) => d).map(([kind, d]) => decodeDeviceId(d, kind, ardupilot));
    if (!infos.length) infos.push(empty);
    const join = field => [...new Set(infos.map(i => i[field]))].join(' / ');
    group(`IMU ${inst + 1}`, join('chip'), join('bus'), join('address'));
    for (const [kind, label] of parts) child(label, ...live(liveKey(kind, inst)));
  }

  for (const inst of range(3)) {
    const dev = deviceId('mag', inst), key = liveKey('mag', inst);
    if (!dev && !S.live.has(key)) continue;
    const info = dev ? decodeDeviceId(dev, 'mag', ardupilot) : empty;
    group(`Compass ${inst + 1}`, info.chip, info.bus, info.address);
    child('Field', ...live(key));
    const field = S.magField.get(inst);
    if (field !== undefined) {
      const bad = field < MAG_FIELD_MIN || field > MAG_FIELD_MAX;
      child('MagField', `${field.toFixed(0)} mGauss   (EMI check ${MAG_FIELD_MIN}-${MAG_FIELD_MAX})`,
        timed(S.live.get(key).t, bad ? COLOR.err : COLOR.ok));
    }
  }

  for (const inst of range(3)) {
    const dev = deviceId('baro', inst), key = liveKey('baro', inst);
    if (!dev && !S.live.has(key)) continue;
    const info = dev ? decodeDeviceId(dev, 'baro', ardupilot) : empty;
    single(`Barometer ${inst + 1}`, info.chip, info.bus, info.address, ...live(key));
  }

  const ports = gpsPorts();
  for (const inst of range(2)) {
    const gtype = gpsType(inst), info = S.gps.get(inst);
    if (!gtype && !info) continue;
    const chip = gtype !== null ? GPS_TYPES[gtype] ?? `Type ${gtype}` : '-';
    const bus = gtype === 9 ? 'DroneCAN' : gtype !== null ? 'Serial' : '-';
    const port = gtype === 9 ? '-' : ports[inst] ?? '-';
    if (!info) { single(`GPS ${inst + 1}`, chip, bus, port, 'No data', COLOR.err); continue; }
    group(`GPS ${inst + 1}`, chip, bus, port);
    const fixColor = info.fixType >= 3 ? COLOR.ok : info.fixType === 2 ? COLOR.warn : COLOR.err;
    child('Fix', info.fix, timed(info.t, fixColor));
    child('Satellites', info.sats !== null ? String(info.sats) : '-', timed(info.t));
    child('HDOP', info.hdop !== null ? info.hdop.toFixed(2) : '-', timed(info.t));
    child('Position', `${info.lat.toFixed(7)}, ${info.lon.toFixed(7)}`, timed(info.t));
    child('Altitude', `${info.alt.toFixed(1)} m`, timed(info.t));
  }

  for (const [kind, param] of [['range', 'RNGFND1_TYPE'], ['flow', 'FLOW_TYPE'], ['airspeed', 'ARSPD_TYPE']]) {
    let instances = [...S.live.keys()].filter(k => k.startsWith(kind + ':')).map(k => +k.split(':')[1]).sort();
    if (!instances.length && paramInt(param)) instances = [0];
    for (const inst of instances) {
      const ptype = inst === 0 ? paramInt(param) : 0;
      single(`${KIND_LABELS[kind]} ${inst + 1}`, ptype ? `Type ${ptype}` : '-', '-', '-', ...live(liveKey(kind, inst)));
    }
  }

  if (S.attitude) {
    const a = S.attitude;
    group('Attitude');
    child('Roll', `${a.roll.toFixed(1)}°`, timed(a.t));
    child('Pitch', `${a.pitch.toFixed(1)}°`, timed(a.t));
    child('Yaw', `${a.yaw.toFixed(1)}°`, timed(a.t));
  }

  const pw = S.power;
  if (pw) {
    group('Power');
    child('Voltage', pw.voltage !== null ? `${pw.voltage.toFixed(2)} V` : '-', timed(pw.t));
    child('Current', pw.current !== null ? `${pw.current.toFixed(2)} A` : '-', timed(pw.t));
    child('Remaining', pw.remaining !== null ? `${pw.remaining} %` : '-', timed(pw.t));
    child('CPU Load', `${pw.load.toFixed(1)} %`, timed(pw.t, pw.load > 80 ? COLOR.warn : ''));
    child('Link Loss', `${pw.drop.toFixed(1)} %`, timed(pw.t, pw.drop > 5 ? COLOR.err : ''));
  }

  for (const v of [...S.values.values()].sort((a, b) => a.label.localeCompare(b.label))) {
    single(v.label, '', '', '', v.text, timed(v.t));
  }
  return rows;
}

function refreshStatusLog(force = false) {
  const maxSeverity = +$('severity').value;
  const key = `${S.logSeq}:${maxSeverity}`;
  if (!force && S.logShown === key) return;
  S.logShown = key;
  const wrap = $('log-wrap');
  const atBottom = wrap.scrollHeight - wrap.scrollTop - wrap.clientHeight < 40;
  const rows = S.log.filter(e => e[1] <= maxSeverity).map(([stamp, level, severity, text]) => {
    const color = level <= K.MAV_SEVERITY_ERROR ? COLOR.err : level === K.MAV_SEVERITY_WARNING ? COLOR.warn
      : level === K.MAV_SEVERITY_DEBUG ? COLOR.muted : '';
    return [{ t: stamp, c: COLOR.muted }, { t: severity, c: color }, { t: text, c: color, cls: 'wrap' }];
  });
  syncRows($('log'), rows);
  if (atBottom) wrap.scrollTop = wrap.scrollHeight;
}

// ---- setup page ------------------------------------------------------------------------------

function detectPeripheral(key) {
  if (!S.target) return ['-', COLOR.muted];
  const mags = new Set(devices('mag').map(d => d.name)), imus = new Set(devices('accel').map(d => d.name));
  const found = {
    hflow: () => fresh('flow') && paramInt('FLOW_TYPE') === 6,
    hmc5883: () => [...mags].some(n => n && n.startsWith('HMC5883')),
    tfluna: () => fresh('range') && paramInt('RNGFND1_TYPE') === 20,
    pmw3901: () => fresh('flow') && paramInt('FLOW_TYPE') === 4,
    mpu9250: () => imus.has('MPU9250') || mags.has('AK8963'),
  }[key]?.() ?? false;
  return found ? ['● Detected', COLOR.ok] : ['● Not detected', COLOR.muted];
}

const peripheralCards = PERIPHERALS.map(spec => {
  const detect = el('span', { class: 'strong', text: '-' });
  const head = el('div', { class: 'card-head' }, el('span', { class: 'card-title', text: spec.name }),
    el('span', { class: 'badge', text: spec.iface }), el('span', { class: 'spacer' }), detect);
  const card = el('div', { class: 'card' }, head, el('div', { class: 'muted', text: spec.note }));
  let portSel = null;
  if (spec.port) {
    portSel = el('select');
    for (let i = 1; i <= 8; i++) portSel.append(el('option', { value: i, text: `SERIAL${i}` }));
    portSel.value = spec.port;
    card.append(el('div', { class: 'toolbar' }, el('span', { class: 'muted', text: 'Serial port' }), portSel));
  }
  const tbody = el('tbody');
  card.append(el('div', { class: 'table-wrap' }, el('table', {},
    el('thead', {}, el('tr', {}, el('th', { text: 'Parameter', style: 'width:100%' }), el('th', { text: 'Current' }), el('th', { text: 'New' }))),
    tbody)));
  const status = el('span', { class: 'status' });
  const apply = el('button', { text: 'Apply', 'data-needs-link': '' });
  card.append(el('div', { class: 'card-foot' }, status, apply));

  const p = { spec, card, inputs: [], current: [] };
  p.entries = () => spec.params.map(([n, v]) => [n.replace('{port}', portSel ? portSel.value : ''), v]);
  p.rebuild = () => {
    tbody.replaceChildren();
    p.inputs = [];
    p.current = [];
    for (const [name, v] of p.entries()) {
      const input = el('input', { type: 'text' });
      input.value = Array.isArray(v) ? '' : String(v);
      const cur = el('td', { text: '-' });
      tbody.append(el('tr', {}, el('td', { text: name }), cur, el('td', {}, input)));
      p.inputs.push(input);
      p.current.push(cur);
    }
    setText(status, '');
  };
  p.refresh = () => {
    p.entries().forEach(([name, v], i) => {
      const [text, color, value] = paramLookup(name);
      setText(p.current[i], text, color);
      if (Array.isArray(v) && !p.inputs[i].value && value !== null) p.inputs[i].value = String(Math.trunc(value) & ~(1 << v[1]));
    });
    setText(detect, ...detectPeripheral(spec.detect));
  };
  if (portSel) portSel.addEventListener('change', p.rebuild);
  apply.addEventListener('click', () => setText(status, ...writeParams(p.entries().map(([n], i) => [n, p.inputs[i].value.trim()]))));
  p.rebuild();
  $('peripherals').append(card);
  return p;
});

$('peripherals').append($('network-template').content.cloneNode(true));
for (const id of ['net-reload', 'net-apply']) $(id).setAttribute('data-needs-link', '');

function parseIPv4(text) {
  const parts = text.trim().split('.');
  if (parts.length !== 4 || parts.some(p => !/^\d{1,3}$/.test(p) || +p > 255)) throw new Error(`invalid IPv4 address '${text}'`);
  return parts.map(Number);
}

function maskBits(text) {
  const s = text.trim().replace(/^\//, '');
  if (/^\d+$/.test(s) && +s <= 32) return +s;
  const [a, b, c, d] = parseIPv4(s);
  const v = ((a << 24) | (b << 16) | (c << 8) | d) >>> 0;
  const bits = Math.clz32(~v >>> 0);  // leading one bits
  if (bits < 32 && (v << bits) >>> 0 !== 0) throw new Error(`invalid netmask '${text}'`);
  return bits;
}

function bitsToMask(bits) {
  const v = bits ? (0xffffffff << (32 - bits)) >>> 0 : 0;
  return [v >>> 24, (v >>> 16) & 255, (v >>> 8) & 255, v & 255].join('.');
}

function updateNetFields() {
  const statik = !$('net-dhcp').checked;
  for (const id of ['net-ip', 'net-mask', 'net-gw']) $(id).disabled = !statik;
}

function loadNetwork() {
  if (S.netLoaded || NET_CONFIG_PARAMS.some(n => !S.params.has(n))) return;
  S.netLoaded = true;
  $('net-enable').checked = !!paramInt('NET_ENABLE');
  $('net-dhcp').checked = !!paramInt('NET_DHCP');
  $('net-ip').value = NET_IP_PARAMS.map(paramInt).join('.');
  $('net-gw').value = NET_GW_PARAMS.map(paramInt).join('.');
  $('net-mask').value = bitsToMask(Math.max(0, Math.min(32, paramInt('NET_NETMASK'))));
  if (NET_MAC_PARAMS.every(n => S.params.has(n))) {
    $('net-mac').textContent = NET_MAC_PARAMS.map(n => paramInt(n).toString(16).toUpperCase().padStart(2, '0')).join(':');
  }
  updateNetFields();
}

function applyNetwork() {
  const pairs = [['NET_ENABLE', $('net-enable').checked ? '1' : '0'], ['NET_DHCP', $('net-dhcp').checked ? '1' : '0']];
  if (!$('net-dhcp').checked) {
    try {
      const ip = parseIPv4($('net-ip').value), gw = parseIPv4($('net-gw').value), bits = maskBits($('net-mask').value);
      NET_IP_PARAMS.forEach((n, i) => pairs.push([n, String(ip[i])]));
      NET_GW_PARAMS.forEach((n, i) => pairs.push([n, String(gw[i])]));
      pairs.push(['NET_NETMASK', String(bits)]);
    } catch (e) {
      setText($('net-status'), `Invalid address: ${e.message}`, COLOR.err);
      return;
    }
  }
  setText($('net-status'), ...writeParams(pairs));
}

function reloadNetwork() {
  for (const n of NET_PARAMS) S.params.delete(n);
  S.netLoaded = false;
  fetchParams();
}

function onboardRows() {
  const t0 = now(), rows = [];
  const recent = d => d && t0 - d.t <= STALE_S;
  const vstate = (v, lo, hi) => v >= lo && v <= hi ? ['OK', COLOR.ok] : ['Out of range', COLOR.err];
  const add = (item, iface, status, color, details) => rows.push([{ t: item, b: true }, { t: iface, c: COLOR.muted },
    { t: status, c: color }, { t: details }]);

  const ps = recent(S.powerStatus) ? S.powerStatus : null;
  const vcc = ps ? ps.vcc : recent(S.hwstatus) ? S.hwstatus.vcc : null;
  if (vcc) add('Scaled 5V', 'ADC', ...vstate(vcc, 4.5, 5.5), `${vcc.toFixed(2)} V`);
  else add('Scaled 5V', 'ADC', 'No data', COLOR.muted, 'Not reported (POWER_STATUS / HWSTATUS)');

  const mcu = recent(S.mcu) ? S.mcu : null;
  if (mcu) {
    add('ADC1 3V3', 'ADC', ...vstate(mcu.v, 3.1, 3.5), `${mcu.v.toFixed(2)} V   (min ${mcu.vmin.toFixed(2)} V, max ${mcu.vmax.toFixed(2)} V)`);
    add('MCU', 'Internal', mcu.temp < 85 ? 'OK' : 'Hot', mcu.temp < 85 ? COLOR.ok : COLOR.warn, `${mcu.temp.toFixed(1)} C`);
  } else {
    add('ADC1 3V3', 'ADC', 'No data', COLOR.muted, 'Not reported (MCU_STATUS)');
  }

  if (ps) {
    const f = ps.flags, oc = f & K.MAV_POWER_STATUS_PERIPH_OVERCURRENT, hp = f & K.MAV_POWER_STATUS_PERIPH_HIPOWER_OVERCURRENT;
    add('Peripheral power nEN / nOC', 'GPIO', oc || hp ? 'Overcurrent' : 'OK', oc || hp ? COLOR.err : COLOR.ok, [
      `nOC ${oc ? 'active' : 'clear'}`, `Hi-power nOC ${hp ? 'active' : 'clear'}`,
      `Brick ${f & K.MAV_POWER_STATUS_BRICK_VALID ? 'OK' : 'invalid'}`,
      f & K.MAV_POWER_STATUS_SERVO_VALID ? `Servo rail ${ps.vservo.toFixed(2)} V` : 'Servo rail not powered',
      f & K.MAV_POWER_STATUS_USB_CONNECTED ? 'USB connected' : 'USB not connected'].join('   '));
  } else {
    add('Peripheral power nEN / nOC', 'GPIO', 'No data', COLOR.muted, 'Not reported (POWER_STATUS)');
  }

  const batt = paramLookup('BATT_MONITOR')[2], pw = S.power;
  const reading = pw && pw.voltage !== null && pw.current !== null ? `${pw.voltage.toFixed(2)} V   ${pw.current.toFixed(2)} A` : 'No reading';
  if (batt === null) add('Onboard INA238', 'I2C', 'Unknown', COLOR.muted, 'BATT_MONITOR not read');
  else if (Math.trunc(batt) === 21) add('Onboard INA238', 'I2C', 'Configured', COLOR.ok, `BATT_MONITOR = 21 (INA2xx)   ${reading}`);
  else add('Onboard INA238', 'I2C', 'Not selected', COLOR.warn, `BATT_MONITOR = ${Math.trunc(batt)} (INA2xx is 21)`);

  const baroInst = range(3).find(i => deviceId('baro', i) && decodeDeviceId(deviceId('baro', i), 'baro', isArduPilot()).name === 'BMP390');
  if (baroInst !== undefined) {
    const baro = decodeDeviceId(deviceId('baro', baroInst), 'baro', isArduPilot());
    const value = S.live.get(liveKey('baro', baroInst));
    add('Onboard Baro BMP390', 'I2C2', 'Detected', COLOR.ok, `${baro.bus}   ${baro.address}` + (value ? `   ${value.text}` : ''));
  } else {
    add('Onboard Baro BMP390', 'I2C2', 'Not detected', devices('baro').length ? COLOR.err : COLOR.muted, 'No BMP390 in BARO*_DEVID');
  }

  const io = paramLookup('BRD_IO_ENABLE')[2];
  if (io === null) add('IO Communication', 'USART6 / IO_STATUS', 'Unknown', COLOR.muted, 'BRD_IO_ENABLE not available');
  else if (!Math.trunc(io)) add('IO Communication', 'USART6 / IO_STATUS', 'Disabled', COLOR.muted, 'BRD_IO_ENABLE = 0');
  else if (S.iomcu && S.iomcu[0] <= K.MAV_SEVERITY_WARNING) add('IO Communication', 'USART6 / IO_STATUS', 'Error', COLOR.err, S.iomcu[1]);
  else add('IO Communication', 'USART6 / IO_STATUS', 'Enabled', COLOR.ok, S.iomcu ? S.iomcu[1] : 'BRD_IO_ENABLE = 1, no IOMCU errors reported');

  const rcState = sysStatusState(K.MAV_SYS_STATUS_SENSOR_RC_RECEIVER), rc = recent(S.rc) ? S.rc : null;
  if (rc && rc.chans.length && (!rcState || rcState[2])) {
    add('SBUS RC', 'Serial', 'Receiving', COLOR.ok, `${rc.chans.length} channels` + (rc.rssi !== 255 ? `   RSSI ${rc.rssi}` : ''));
  } else if (rcState && rcState[0]) {
    add('SBUS RC', 'Serial', 'No signal', COLOR.err, 'RC receiver present but unhealthy');
  } else {
    add('SBUS RC', 'Serial', 'No signal', COLOR.muted, 'No RC_CHANNELS data');
  }

  const log = sysStatusState(K.MAV_SYS_STATUS_LOGGING);
  if (!log) add('SD Card', 'SDMMC', 'Unknown', COLOR.muted, 'Waiting for SYS_STATUS');
  else if (!log[0]) add('SD Card', 'SDMMC', 'Not reported', COLOR.muted, 'Logging disabled');
  else if (log[2]) add('SD Card', 'SDMMC', 'Present', COLOR.ok, 'Logging healthy');
  else add('SD Card', 'SDMMC', 'Missing / error', COLOR.err, 'Logging unhealthy (no card or write error)');

  const proto = paramLookup(`SERIAL${CM5_SERIAL_PORT}_PROTOCOL`)[2], baud = paramLookup(`SERIAL${CM5_SERIAL_PORT}_BAUD`)[2];
  if (proto === null) {
    add('CM5 Serial', 'USART2 / TELEM3', 'Unknown', COLOR.muted, `SERIAL${CM5_SERIAL_PORT} not read`);
  } else {
    const name = SERIAL_PROTOCOLS[Math.trunc(proto)] ?? `Protocol ${Math.trunc(proto)}`;
    const rate = baud !== null ? SERIAL_BAUDS[Math.trunc(baud)] ?? baud : '-';
    const good = [1, 2, 45].includes(Math.trunc(proto));
    add('CM5 Serial', 'USART2 / TELEM3', good ? 'Configured' : name, good ? COLOR.ok : COLOR.warn, `SERIAL${CM5_SERIAL_PORT}: ${name} @ ${rate}`);
  }

  const paramsOk = S.paramNames.some(n => S.params.has(n));
  add('Onboard EEPROM AT24C02D', 'I2C3', 'Not reported', COLOR.muted, 'No MAVLink status for this device');
  add('FRAM FM25V02A', 'SPI5', paramsOk ? 'Params readable' : 'Unknown', paramsOk ? COLOR.ok : COLOR.muted, 'Parameter storage (indirect check)');
  return rows;
}

function refreshSetup() {
  syncRows($('onboard'), onboardRows());
  for (const p of peripheralCards) p.refresh();
  loadNetwork();
  if (paramMissing('NET_ENABLE')) setText($('net-status'), 'Board has no NET_* parameters (no Ethernet support)', COLOR.muted);
}

// ---- refresh loop ----------------------------------------------------------------------------

function updateParamInfo() {
  let text = '';
  if (S.paramNames.length) {
    const got = S.paramNames.filter(n => S.params.has(n)).length;
    text = paramFetching() ? `Reading parameters ${got}/${S.paramNames.length}...` : `${got} of ${S.paramNames.length} parameters found`;
  } else if (S.target) {
    text = 'Parameters not available for this autopilot';
  }
  for (const node of document.querySelectorAll('.param-info')) setText(node, text);
}

let currentPage = 'monitor';
function refresh() {
  updatePill();
  updateParamInfo();
  if (currentPage === 'monitor') {
    refreshBoard();
    syncRows($('live'), liveRows());
    refreshStatusLog();
  } else {
    refreshSetup();
  }
}

function clearViews() {
  for (const id of ['live', 'log', 'onboard']) $(id).replaceChildren();
  for (const v of Object.values(boardValues)) setText(v, '-');
  syncChannels($('rc'), []);
  syncChannels($('servo'), []);
  setText($('rc-info'), '');
  for (const p of peripheralCards) p.rebuild();
  for (const id of ['net-ip', 'net-mask', 'net-gw']) $(id).value = '';
  $('net-mac').textContent = '-';
  setText($('net-status'), '');
  for (const node of document.querySelectorAll('.param-info')) setText(node, '');
}

// ---- wiring ----------------------------------------------------------------------------------

for (const b of BAUD_RATES) $('baud').append(el('option', { value: b, text: String(b) }));
$('baud').value = DEFAULT_BAUD;
for (const id of ['reload-ids', 'read-params', 'reboot']) $(id).setAttribute('data-needs-link', '');

for (const btn of document.querySelectorAll('.nav')) {
  btn.addEventListener('click', () => {
    currentPage = btn.dataset.page;
    for (const b of document.querySelectorAll('.nav')) b.classList.toggle('active', b === btn);
    $('page-monitor').hidden = currentPage !== 'monitor';
    $('page-setup').hidden = currentPage !== 'setup';
    if (conn.port) refresh();
  });
}

$('connect').addEventListener('click', () => conn.port ? disconnect() : connect());
$('reload-ids').addEventListener('click', startParamFetch);
$('read-params').addEventListener('click', startParamFetch);
$('reboot').addEventListener('click', () => {
  if (S.target && confirm('Reboot the flight controller now?')) {
    sendCommand(K.MAV_CMD_PREFLIGHT_REBOOT_SHUTDOWN, 1);
    notify('Reboot command sent');
  }
});
$('severity').addEventListener('change', () => refreshStatusLog(true));
$('clear-log').addEventListener('click', () => { S.log = []; S.logSeq++; refreshStatusLog(true); });
$('net-dhcp').addEventListener('change', updateNetFields);
$('net-apply').addEventListener('click', applyNetwork);
$('net-reload').addEventListener('click', reloadNetwork);

// Safe shutdown: warn while parameter writes are unconfirmed, always release the port on exit.
window.addEventListener('beforeunload', event => {
  if (conn.port && paramFetching()) {
    event.preventDefault();
    event.returnValue = '';
  }
});
window.addEventListener('pagehide', () => { if (conn.port) disconnect(); });

if ('serial' in navigator) {
  navigator.serial.addEventListener('disconnect', event => {
    if (event.target === conn.port) {
      notify('Board unplugged', 0);
      disconnect();
    }
  });
} else {
  $('unsupported').hidden = false;
  $('connect').disabled = true;
}

syncChannels($('rc'), []);
syncChannels($('servo'), []);
setConnectedUi(false);
</script>
</body>
</html>
